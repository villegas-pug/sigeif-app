  
spring:
   application:
      name: microservice-cedif
   profiles:
      active: ${PROFILE:prod}

   datasource:
      hikari:
      
         # Configuración clave para reintentos
         initialization-fail-timeout: -1  # No fallar al inicio
         connection-timeout: 60000
         validation-timeout: 5000
         
         # Pool de conexiones
         maximum-pool-size: 20
         minimum-idle: 5
         idle-timeout: 300000
         max-lifetime: 1200000
         leak-detection-threshold: 60000

   jpa:
      database-platform: org.hibernate.dialect.OracleDialect
      ddl-auto: validate
      show-sql: false
      properties:
         hibernate:
            format_sql: true

   servlet:
     multipart:
       max-request-size: 10MB
       max-file-size: 10MB

logging:
   level:
      org.hibernate.SQL: WARN
      org.hibernate.type.descriptor.sql.BasicBinder: WARN


server:
  port: ${PORT:4002}
  servlet:
    context-path: /api/ms-cedif/